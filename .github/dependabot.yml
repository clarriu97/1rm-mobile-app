# Weekly, one grouped pull request per ecosystem, so each round needs a
# single `tool/ci.sh all` run to pass the local-e2e gate. The Flutter SDK is
# pinned in the workflows and bumped by hand (with the local SDK and the
# goldens), so it's not here.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
