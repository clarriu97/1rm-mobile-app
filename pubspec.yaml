name: one_rm_mobile
description: "Estimate, log, and track your one-rep max."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  intl: any
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/fonts/OFL-BigShouldersDisplay.txt
    - assets/fonts/OFL-Barlow.txt

  fonts:
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/BigShouldersDisplay-Variable.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

# Artwork sources: tool/generate_branding.py → assets/branding/
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0E0F11"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png

flutter_native_splash:
  color: "#0E0F11"
  image: assets/branding/splash.png
  android_12:
    color: "#0E0F11"
    image: assets/branding/splash_android12.png
  ios: true
  android: true
  web: false
