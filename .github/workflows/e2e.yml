name: E2E

# The integration_test flows on real simulators/emulators: the smallest
# current iPhone in Spanish and the largest in English, and Android on the
# oldest supported API with a small screen and the newest API with a large
# one. Same commands as `tool/ci.sh e2e-ios <size>` / `tool/ci.sh e2e-android`
# locally. Plus the release builds (Android app bundle with R8, iOS without
# code signing) and a smoke test of the Android release build.
#
# Not run on pull requests: device runs on shared CI machines occasionally
# fail to attach to the app, which says nothing about the code. Before a
# merge, `tool/ci.sh all` runs these flows locally and reports the
# `local-e2e` status that main requires (see docs/RELEASING.md). Here they run
# after every merge, every night, on demand, and for every release tag.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  # Release builds as the stores get them: Android with R8, iOS without code
  # signing (signing arrives with the store accounts in phase 2). Pull
  # requests don't wait for them: `tool/ci.sh all` builds both locally.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cached: what every run would otherwise download before compiling a
      # line (Gradle dependencies, the Flutter Android engine, CMake).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          # Its own key, so the SDK cache keeps the Android engine artifacts.
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-android"

      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake
          key: android-cmake-${{ runner.os }}-3.22.1

      - run: flutter pub get

      - run: tool/ci.sh build-android

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: tool/ci.sh build-ios

  ios:
    name: iOS · ${{ matrix.size }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Boots in the background during pub get and the build. Not earlier:
      # booting slows restoring the 2 GB SDK cache from ~1.5 to ~5 min.
      - name: Start simulator
        run: echo "SIM_UDID=$(tool/ci.sh boot-ios ${{ matrix.size }})" >> "$GITHUB_ENV"

      - run: tool/ci.sh e2e-ios ${{ matrix.size }}

  android:
    name: Android · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest API Flutter supports, on a small 360 × 640 dp screen.
          # Cold boot: installs hang when resuming this image from a snapshot.
          - api-level: 24
            target: default
            profile: Nexus 5
            snapshot: false
          # Newest API, on a large 412 × 915 dp screen; also launches the
          # release (R8) build, which the debug-only e2e flows can't cover.
          - api-level: 35
            target: google_apis
            profile: pixel_7
            snapshot: true
            release-smoke: true
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A booted-emulator snapshot, created once per configuration: later runs
      # resume it in seconds instead of cold-booting.
      - uses: actions/cache@v4
        if: matrix.snapshot
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}

      - name: Create emulator snapshot
        if: matrix.snapshot && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot saved."

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ matrix.snapshot && '-no-snapshot-save' || '-no-snapshot' }} ${{ env.EMULATOR_OPTIONS }}
          # Turns on "Remove animations": Android runs exercise the static
          # fallbacks, iOS runs the full motion.
          disable-animations: true
          script: tool/ci.sh e2e-android${{ matrix.release-smoke && ' && tool/ci.sh smoke-android-release' || '' }}
