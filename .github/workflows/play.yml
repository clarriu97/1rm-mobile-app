name: Google Play

# Builds the app bundle signed with the upload key and uploads it to Google
# Play together with the store listing in fastlane/ (texts, screenshots,
# feature graphic and icon). Run by hand from the Actions tab, and by the
# Release workflow for every version tag. The debug symbols of the build are
# kept as an artifact, to read crash traces (docs/RELEASING.md).
#
# Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD
# (the upload key, alias `upload`), PLAY_SERVICE_ACCOUNT_JSON (the
# play-publisher service account).

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (draft while the app has never been published)
        type: choice
        options: [draft, completed]
        default: draft
  workflow_call:
    inputs:
      track:
        type: string
        default: internal
      status:
        type: string
        default: completed

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  PACKAGE_NAME: dev.larri.onerm

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-android"

      - run: flutter pub get

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$PASSWORD" "$PASSWORD" > android/key.properties

      - run: tool/ci.sh build-android

      - uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-android-${{ github.sha }}
          path: build/debug-info
          retention-days: 90

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"

      - run: gem install fastlane --no-document

      - name: Upload to Google Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          fastlane run upload_to_play_store \
            package_name:"$PACKAGE_NAME" \
            json_key:"$RUNNER_TEMP/play.json" \
            aab:build/app/outputs/bundle/release/app-release.aab \
            track:"${{ inputs.track }}" \
            release_status:"${{ inputs.status }}" \
            metadata_path:fastlane/metadata/android
