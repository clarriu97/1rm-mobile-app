name: Smoke repro

on:
  push:
    branches: [fix/84-release-smoke-flake]

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  android:
    name: Android · API 35 · ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
        api-level: [35]
        target: [google_apis]
        profile: [pixel_7]
        snapshot: [true]
        release-smoke: [true]
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A booted-emulator snapshot, created once per configuration: later runs
      # resume it in seconds instead of cold-booting.
      - uses: actions/cache@v4
        if: matrix.snapshot
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}

      - name: Create emulator snapshot
        if: matrix.snapshot && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot saved."

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ matrix.snapshot && '-no-snapshot-save' || '-no-snapshot' }} ${{ env.EMULATOR_OPTIONS }}
          # Turns on "Remove animations": Android runs exercise the static
          # fallbacks, iOS runs the full motion.
          disable-animations: true
          script: tool/ci.sh e2e-android${{ matrix.release-smoke && ' && tool/ci.sh smoke-android-release' || '' }}

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.release-smoke
        with:
          name: smoke-android-release-${{ matrix.run }}
          path: build/smoke-android/
          if-no-files-found: ignore
