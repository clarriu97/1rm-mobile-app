<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Lifter & Environment (Opacity 0.3) -->
  <g opacity="0.3">
    <!-- Head -->
    <circle cx="45" cy="15" r="8" fill="currentColor" stroke="none"/>
    <!-- Body (Torso upright -> Thigh -> Calf) -->
    <path d="M45 25 L40 65 L70 65 L60 95" />
    <!-- Arm (Front rack position: high elbow) -->
    <path d="M45 25 L65 30 L50 26" stroke-width="6"/> 
    <!-- Ground -->
    <line x1="10" y1="95" x2="90" y2="95" stroke-width="4"/>
  </g>
  <!-- The Iron (Opacity 1.0) -->
  <g opacity="1.0">
    <!-- Plates -->
    <path d="M16 16 v28 M84 16 v28" stroke-width="12"/>
    <!-- Barbell -->
    <line x1="16" y1="30" x2="84" y2="30" stroke-width="6"/>
  </g>
</svg>