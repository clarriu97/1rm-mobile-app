name: E2E

# The integration_test flows on real simulators/emulators: the smallest and
# largest iPhone, and Android on the oldest supported API with a small screen
# and the newest API with a large one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  ios:
    name: iOS · ${{ matrix.size }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: small
            # iPhone SE / "e" models: the narrowest current iPhones.
            pattern: "iPhone (SE|[0-9]+e)"
          - size: large
            pattern: "Pro Max"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Boot simulator
        id: sim
        run: |
          # Latest available device matching the pattern, on the newest runtime.
          udid=$(xcrun simctl list devices available -j | jq -r --arg p "${{ matrix.pattern }}" '
            [.devices | to_entries[]
              | select(.key | test("iOS"))
              | .key as $rt | .value[]
              | select(.name | test($p)) | {rt: $rt, udid, name}]
            | sort_by(.rt) | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            xcrun simctl list devices available
            echo "No simulator matches '${{ matrix.pattern }}'" >&2
            exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - run: flutter test integration_test -d ${{ steps.sim.outputs.udid }}

  android:
    name: Android · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest API Flutter supports, on a small 360 × 640 dp screen.
          - api-level: 24
            target: default
            profile: Nexus 5
          # Newest API, on a large 412 × 915 dp screen.
          - api-level: 35
            target: google_apis
            profile: pixel_7
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Turns on "Remove animations": Android runs exercise the static
          # fallbacks, iOS runs the full motion.
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
